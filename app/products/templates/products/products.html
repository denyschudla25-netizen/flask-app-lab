
{% extends "base.html" %}

{% block content %}
<div class="container">
    <h1>Список товарів</h1>

    {% for product in products %}
        <div>
            <h2>{{ product.name }}</h2>
            <p>Ціна: {{ product.price }} $</p>
            <a href="{{ url_for('products.detail_product', product_id=product.id) }}">
                Детальніше
            </a>
        </div>
        <hr>
    {% endfor %}
</div>
{% endblock %}
