{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <h1 class="mb-4 text-center">Вхід</h1>

        <form method="POST" action="{{ url_for('users.login') }}">
            <div class="mb-3">
                <label for="username" class="form-label">Ім’я користувача</label>
                <input
                    type="text"
                    class="form-control"
                    id="username"
                    name="username"
                    required
                >
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Пароль</label>
                <input
                    type="password"
                    class="form-control"
                    id="password"
                    name="password"
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Увійти
            </button>
        </form>

        <p class="text-muted mt-3">
            Тестовий користувач: user1, пароль: 12345
        </p>
    </div>
</div>
{% endblock %}
