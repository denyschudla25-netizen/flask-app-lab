{% extends "base.html" %}

{% block title %}Видалення поста{% endblock %}

{% block content %}

<div class="card shadow-sm">

    <div class="card-body">

        <h2>Видалення поста</h2>

        <p>
            Ви впевнені, що хочете видалити пост
            <strong>{{ post.title }}</strong>?
        </p>

        <form method="POST">

            <input type="hidden" name="csrf_token"
                   value="{{ csrf_token() }}">

            <button type="submit" class="btn btn-danger">
                Так, видалити
            </button>

            <a href="{{ url_for('posts.detail_post', id=post.id) }}"
               class="btn btn-secondary">
                Скасувати
            </a>

        </form>

    </div>

</div>

{% endblock %}
