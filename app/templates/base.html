<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}Flask Blog{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/styles.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('posts.static', filename='css/posts.css') }}">

    {% block styles %}{% endblock %}
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('main.home') }}">
            Flask Blog
        </a>

        <div class="navbar-nav">
            <a class="nav-link" href="{{ url_for('main.home') }}">Головна</a>
            <a class="nav-link" href="{{ url_for('posts.all_posts') }}">Пости</a>
            <a class="nav-link" href="{{ url_for('main.resume') }}">Резюме</a>
            <a class="nav-link" href="{{ url_for('main.contacts') }}">Контакти</a>
        </div>
    </div>
</nav>

<main class="container py-4">

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show">
                    {{ message }}
                    <button type="button" class="btn-close"
                            data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
